<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Template</title>
</head>
<body>
<div id="app">
<!--  <h2>{{ title }}</h2>-->

</div>

<script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
<script>
  var vue = new Vue ({
    data: {
      title: 'Hi Im Vue!',
    },
    template: '<div><h1>{{ title }}</h1><p>Paragraph</p></div>',
  });

  vue.$mount('#app')

</script>
</body>
</html>
